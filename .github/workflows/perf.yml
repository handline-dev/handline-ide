# How much the web app draws in everyday scenarios (apps/web/scripts/perf/run.ts), checked against apps/web/perf-budget.json:
# on the first push to main of each UTC day and on a manual run only, not on pull requests. Headless Chrome only.
# A failed run comments on one open issue titled "Nightly perf run failed" (opened if none), so a bad week is one thread.
name: perf

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read
  issues: write

jobs:
  due:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.d.outputs.run }}
    steps:
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's cron never ran in this repository, so the daily run is the first push of a UTC day: the head before it was committed on an earlier day.
          # A manual run always goes.
          run=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            day="$(gh api "repos/$GITHUB_REPOSITORY/commits/${{ github.event.before }}" --jq '.commit.committer.date[:10]' 2>/dev/null || true)"
            [ "$day" != "$(date -u +%F)" ] || run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  web:
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @handline/web perf
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: perf
          path: apps/web/scripts/perf/out/perf.json
          if-no-files-found: ignore
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Nightly perf run failed'
          n="$(gh issue list --state open --search "\"$title\" in:title" --json number,title -q "[.[]|select(.title==\"$title\")][0].number // empty")"
          body="The perf run failed on $GITHUB_REF_NAME ($GITHUB_EVENT_NAME): $RUN"
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
