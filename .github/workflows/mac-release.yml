# The Mac app on GitHub Releases in three channels, each one rolling prerelease at a tag that never changes (so its download address can be given out once):
#   mac-canary  built every 30 minutes, only when main has commits the last Canary build does not have;
#   mac-nightly built every night from main, on the same condition;
#   mac-stable  by hand (channel stable): the current Nightly's commit built again under the Nightly's version number, so a Stable dmg reads Stable updates.
# Each holds, for Apple silicon (arm64) and for Intel (x64), a dmg and a zip, each with only its own Electron, daemon and CLI, and the file the app of
# that architecture reads (latest-mac.yml, latest-x64-mac.yml): the app reads it at its channel's download address (electron-updater's generic
# provider, and the self-written updater until a Developer ID exists). The version is 0.1.<run number>, which only grows, the same across channels.
# A manual run of canary or nightly always builds. Signed ad hoc unless HANDLINE_SIGN_IDENTITY is set (apps/electron/electron-builder.config.mjs).
name: mac-release

on:
  schedule:
    - cron: '*/30 * * * *'
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: canary, nightly, or stable (the current Nightly's commit, built again)
        type: choice
        options: [canary, nightly, stable]
        default: nightly
      ref:
        description: Commit, branch or tag to build for canary or nightly (default main)
        default: main

concurrency:
  group: mac-release-${{ inputs.channel || (github.event.schedule == '30 18 * * *' && 'nightly' || 'canary') }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.p.outputs.build }}
      channel: ${{ steps.p.outputs.channel }}
      ref: ${{ steps.p.outputs.ref }}
      version: ${{ steps.p.outputs.version }}
    steps:
      - id: p
        name: Pick the channel, and build only when main has moved since the channel's last build (a manual run always builds)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            if [ "${{ github.event.schedule }}" = '30 18 * * *' ]; then channel=nightly; else channel=canary; fi
          else
            channel="${{ inputs.channel }}"
          fi
          build=true
          ref="${{ inputs.ref || 'main' }}"
          version="0.1.${{ github.run_number }}"
          # The release notes end with the commit the build was made from.
          at() { gh release view "mac-$1" --repo "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null | sed -n 's/^Commit: //p' | head -1 || true; }
          if [ "$channel" = stable ]; then
            ref="$(at nightly)"
            version="$(gh release view mac-nightly --repo "$GITHUB_REPOSITORY" --json name -q .name | sed -n 's/^Handline for Mac \([0-9.]*\).*/\1/p')"
            [ -n "$ref" ] && [ -n "$version" ] || { echo "there is no Nightly to make Stable from"; exit 1; }
          elif [ "${{ github.event_name }}" = schedule ]; then
            [ "$(at "$channel")" != "$GITHUB_SHA" ] || build=false
          fi
          { echo "build=$build"; echo "channel=$channel"; echo "ref=$ref"; echo "version=$version"; } >> "$GITHUB_OUTPUT"
  app:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
    env:
      CHANNEL: ${{ needs.plan.outputs.channel }}
      VERSION: ${{ needs.plan.outputs.version }}
      HANDLINE_UPDATE_URL: https://github.com/${{ github.repository }}/releases/download/mac-${{ needs.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Build the app
        env:
          HANDLINE_SIGN_IDENTITY: ${{ secrets.HANDLINE_SIGN_IDENTITY }}
        run: pnpm --filter @handline/electron package "$VERSION"
      - name: Check what was built
        run: |
          cd apps/electron/release
          ls -l
          # Each architecture: its dmg, its zip, and the file its app reads, which must name the zip it sits beside, with the checksum the app verifies
          # (the sha512 in the yml is base64 of the digest).
          for arch in arm64 x64; do
            if [ "$arch" = x64 ]; then yml=latest-x64-mac.yml; else yml=latest-mac.yml; fi
            for f in "$yml" "Handline-$VERSION-$arch-mac.zip" "Handline-$VERSION-$arch.dmg"; do ls "$f" >/dev/null || { echo "missing $f"; exit 1; }; done
            grep -q "version: $VERSION" "$yml"
            for f in "Handline-$VERSION-$arch-mac.zip" "Handline-$VERSION-$arch.dmg"; do
              want="$(awk -v n="$f" '$1=="-" && $2=="url:" && $3==n {g=1} g && $1=="sha512:" {print $2; exit}' "$yml")"
              got="$(shasum -a 512 "$f" | cut -d' ' -f1 | xxd -r -p | base64)"
              [ -n "$want" ] && [ "$want" = "$got" ] || { echo "sha512 of $f is not the one in $yml"; exit 1; }
            done
          done
      - name: Update the rolling release, new files first, the yml files last, old files out at the end
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/electron/release
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/mac-$CHANNEL"
          notes="Handline for Mac $VERSION ($CHANNEL)

          Apple silicon (M1 and later): $base/Handline-$VERSION-arm64.dmg
          Intel: $base/Handline-$VERSION-x64.dmg

          latest-mac.yml (Apple silicon) and latest-x64-mac.yml (Intel) are what the apps read to see if they are up to date.
          Commit: $(git rev-parse HEAD)"
          assets=(Handline-*-mac.zip Handline-*.dmg Handline-*.blockmap)
          ymls=(latest-mac.yml latest-x64-mac.yml)
          if gh release view "mac-$CHANNEL" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "mac-$CHANNEL" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release upload "mac-$CHANNEL" "${ymls[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "mac-$CHANNEL" --repo "$GITHUB_REPOSITORY" --title "Handline for Mac $VERSION ($CHANNEL)" --notes "$notes"
            for old in $(gh release view "mac-$CHANNEL" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
              case " ${assets[*]} ${ymls[*]} " in *" $old "*) ;; *) gh release delete-asset "mac-$CHANNEL" "$old" --repo "$GITHUB_REPOSITORY" --yes ;; esac
            done
          else
            gh release create "mac-$CHANNEL" "${ymls[@]}" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --prerelease --target "$(git rev-parse HEAD)" --title "Handline for Mac $VERSION ($CHANNEL)" --notes "$notes"
          fi
      - if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="$CHANNEL Mac build failed"
          n="$(gh issue list --state open --search "\"$title\" in:title" --json number,title -q "[.[]|select(.title==\"$title\")][0].number // empty")"
          body="The Mac build failed on $GITHUB_REF_NAME ($GITHUB_EVENT_NAME): $RUN"
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
